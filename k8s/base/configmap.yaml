apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-config
  namespace: swiftdrop
data:
  NODE_ENV: "production"
  PORT: "5000"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "swiftdrop_db"
  REDIS_URL: "redis://redis-service:6379"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
  NEXT_PUBLIC_API_URL: "https://api.swiftdrop.local/api/v1"
  NEXT_PUBLIC_WS_URL: "wss://api.swiftdrop.local"
