apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  namespace: swiftdrop
type: Opaque
stringData:
  DATABASE_PASSWORD: "example_production_db_password"
  DATABASE_URL: "postgresql://postgres:example_production_db_password@postgres-service:5432/swiftdrop_db?schema=public"
  JWT_ACCESS_SECRET: "replace_with_prod_jwt_access_secret_256bit"
  JWT_REFRESH_SECRET: "replace_with_prod_jwt_refresh_secret_256bit"
  GOOGLE_CLIENT_ID: "sample_client_id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "sample_client_secret"
  WEBHOOK_HMAC_SECRET: "sample_production_webhook_hmac_secret"
  GEMINI_API_KEY: "sample_gemini_api_key"
