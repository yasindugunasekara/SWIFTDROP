apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  namespace: swiftdrop
type: Opaque
stringData:
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_ANON_KEY: "replace_with_project_publishable_key"
  RABBITMQ_USER: "swiftdrop"
  RABBITMQ_PASSWORD: "replace_with_random_password"
  RABBITMQ_URL: "amqp://swiftdrop:replace_with_url_encoded_random_password@rabbitmq-service:5672"
  DATABASE_PASSWORD: "example_production_db_password"
  # Must be the same database used by the configured Supabase Auth project.
  DATABASE_URL: "postgresql://postgres:replace_with_database_password@your-supabase-pooler:5432/postgres"
  JWT_ACCESS_SECRET: "replace_with_prod_jwt_access_secret_256bit"
  JWT_REFRESH_SECRET: "replace_with_prod_jwt_refresh_secret_256bit"
  GOOGLE_CLIENT_ID: "sample_client_id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "sample_client_secret"
  WEBHOOK_HMAC_SECRET: "sample_production_webhook_hmac_secret"
  GEMINI_API_KEY: "sample_gemini_api_key"
