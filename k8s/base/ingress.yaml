apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftdrop-ingress
  namespace: swiftdrop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: swiftdrop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swiftdrop-web-service
                port:
                  number: 3000
    - host: api.swiftdrop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swiftdrop-api-service
                port:
                  number: 5000
