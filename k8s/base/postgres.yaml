apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: DATABASE_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: swiftdrop
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
