apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftdrop-api-deployment
  namespace: swiftdrop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiftdrop-api
  template:
    metadata:
      labels:
        app: swiftdrop-api
    spec:
      containers:
        - name: swiftdrop-api
          image: swiftdrop/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: swiftdrop-config
            - secretRef:
                name: swiftdrop-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: swiftdrop-api-service
  namespace: swiftdrop
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: swiftdrop-api
