<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E65100" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#swiftGrad)" filter="url(#shadow)"/>
  
  <!-- Isometric Parcel Box Contour -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Face -->
    <polygon points="256,120 380,185 256,250 132,185" />
    <!-- Vertical Edges -->
    <line x1="132" y1="185" x2="132" y2="335" />
    <line x1="256" y1="250" x2="256" y2="400" />
    <line x1="380" y1="185" x2="380" y2="335" />
    <!-- Bottom Edges -->
    <line x1="132" y1="335" x2="256" y2="400" />
    <line x1="380" y1="335" x2="256" y2="400" />
  </g>
  
  <!-- Central High-Velocity Lightning Bolt -->
  <polygon points="268,145 205,260 255,260 235,365 310,240 260,240" fill="#FFFFFF" />
  
  <!-- Signature SwiftDrop Dot -->
  <circle cx="395" cy="125" r="20" fill="#FFFFFF" />
</svg>