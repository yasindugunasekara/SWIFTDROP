# Supabase provides authentication and PostgreSQL; credentials stay outside images.
x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-swiftdrop}:${RABBITMQ_PASSWORD:-swiftdrop_local}@rabbitmq:5672
  TRACKING_WS_URL: ${TRACKING_WS_URL:-ws://localhost:5000/ws/tracking}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-swiftdrop_local}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  server:
    image: swiftdrop-server:local
    build:
      context: ./server
    init: true
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      <<: *app-environment
      PORT: "5000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: swiftdrop-server:local
    build:
      context: ./server
    command: ["node", "dist/workers/index.js"]
    init: true
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment: *app-environment
    depends_on:
      server:
        condition: service_healthy

  web:
    image: swiftdrop-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      <<: *app-environment
      PORT: "3000"
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/web/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  redis_data:
  rabbitmq_data:
  uploads_data:
